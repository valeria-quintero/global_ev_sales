services:
  db:
    image: postgres:16-alpine
    container_name: ev_sales_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ev
      POSTGRES_PASSWORD: ev
      POSTGRES_DB: ev_sales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
